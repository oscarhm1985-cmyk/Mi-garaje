function compressImage(file, maxW=800, quality=0.55) {
  return new Promise((resolve,reject) => {
    const reader=new FileReader();
    reader.onerror=reject;
    reader.onload=e=>{
      const img=new Image();
      img.onerror=reject;
      img.onload=()=>{
        const ratio=Math.min(1,maxW/img.width);
        const canvas=document.createElement("canvas");
        canvas.width=Math.round(img.width*ratio);
        canvas.height=Math.round(img.height*ratio);
        canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL("image/jpeg",quality));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function calcNext(comp, currentKm) {
  const lastKm=parseInt(comp.lastKm)||null;
  const lastDate=comp.lastDate||null;
  const intKm=comp.intervalKm||null;
  const intMon=comp.intervalMonths||null;
  let nextKm=null, nextDate=null;
  if(lastKm&&intKm) nextKm=lastKm+intKm;
  if(lastDate&&intMon){const d=new Date(lastDate);d.setMonth(d.getMonth()+intMon);nextDate=d.toISOString().slice(0,10);}
  const kmLeft=(nextKm&&currentKm)?nextKm-parseInt(currentKm):null;
  const dayLeft=nextDate?daysDiff(nextDate):null;
  const urgencyKm=kmLeft!==null?(kmLeft<0?-9999:kmLeft):999999;
  const urgencyDay=dayLeft!==null?(dayLeft<0?-9999:dayLeft*50):999999;
  return {nextKm,nextDate,kmLeft,dayLeft,urgent:Math.min(urgencyKm,urgencyDay)};
}

  const itv=parseFloat(vehicle.itv?.price||0)+(vehicle.itvHistory||[]).reduce((s,r)=>s+(parseFloat(r.price)||0),0);
  const ivtm=(vehicle.ivtmHistory||[]).reduce((s,r)=>s+(parseFloat(r.price)||0),0)+parseFloat(vehicle.ivtm?.price||0);
  const averias=bds.reduce((s,b)=>{const bt=(b.bills||[]).reduce((t,bi)=>t+(parseFloat(bi.amount)||0),0);return s+(parseFloat(b.price)||bt||0);},0);
  const revisiones=(vehicle.maintenanceComponents||[]).reduce((s,c)=>s+(c.history||[]).reduce((t,h)=>t+(parseFloat(h.price)||0),0),0);
  const partes=cls.reduce((s,c)=>{const bt=(c.bills||[]).reduce((t,b)=>t+(parseFloat(b.amount)||0),0);return s+(parseFloat(c.price)||bt||0);},0);
  const combustible=fls.reduce((s,f)=>s+(parseFloat(f.total)||0),0);
  return {seguro,itv,ivtm,averias,revisiones,partes,combustible,total:seguro+itv+ivtm+averias+revisiones+partes+combustible};
}

function PhotoUploader({value,onChange,label="Foto",maxW=800,quality=0.55,size=100}){
  const [loading,setLoading]=useState(false);
  const [warn,setWarn]=useState(false);
  const inputRef=useRef();
  const handle=async(e)=>{
    const file=e.target.files?.[0]; if(!file) return;
    setLoading(true); setWarn(false);
    try{const b64=await compressImage(file,maxW,quality);const kb=Math.round(b64.length*0.75/1024);if(kb>300)setWarn(true);onChange(b64);}catch(err){console.error(err);}
    setLoading(false);
  };
  return(
    <div style={{marginBottom:14}}>
      <label style={{fontSize:10,color:C.dim,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em",display:"block",marginBottom:6}}>{label}</label>
      <div style={{display:"flex",alignItems:"center",gap:12}}>
        <div onClick={()=>inputRef.current?.click()} style={{width:size,height:size*0.6,borderRadius:10,overflow:"hidden",background:C.card2,border:`1px dashed ${value?C.gold:C.border}`,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,position:"relative"}}>
          {value?<img src={value} alt="foto" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<span style={{fontSize:24,opacity:0.4}}>📷</span>}
          {loading&&<div style={{position:"absolute",inset:0,background:"#000a",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:"#fff"}}>...</div>}
        </div>
        <div>
          <button type="button" onClick={()=>inputRef.current?.click()} style={{...ghostBtn(C.gold),marginBottom:6,display:"block"}}>{value?"Cambiar foto":"Subir foto"}</button>
          {value&&<button type="button" onClick={()=>onChange("")} style={ghostBtn(C.danger)}>Quitar</button>}
          {warn&&<div style={{fontSize:10,color:C.warn,marginTop:4}}>⚠️ Imagen grande.</div>}
        </div>
      </div>
      <input ref={inputRef} type="file" accept="image/*" style={{display:"none"}} onChange={handle}/>
    </div>
  );
}

function AttachButton({value,onChange}){
  const [loading,setLoading]=useState(false);
  const inputRef=useRef();
  const handle=async(e)=>{
    const file=e.target.files?.[0]; if(!file) return;
    setLoading(true);
    const isPDF=file.type==="application/pdf";
    const kb=Math.round(file.size/1024);
    if(isPDF){onChange({type:"pdf",name:file.name,size:kb,data:null,driveOnly:kb>200});}
    else{const b64=await compressImage(file,1400,0.7);const bKb=Math.round(b64.length*0.75/1024);onChange({type:"img",name:file.name,size:bKb,data:bKb<300?b64:null,driveOnly:bKb>=300});}
    setLoading(false);
  };
  if(value) return(
    <div style={{display:"flex",alignItems:"center",gap:8,background:C.bg,borderRadius:8,padding:"6px 10px",border:`1px solid ${C.border}`}}>
      <span style={{fontSize:14}}>{value.type==="pdf"?"📄":"🖼️"}</span>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:11,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{value.name}</div>
        {value.driveOnly?<div style={{fontSize:9,color:C.warn}}>☁️ Grande · guarda en Drive</div>:<div style={{fontSize:9,color:C.ok}}>✓ Guardado ({value.size} KB)</div>}
      </div>
      {value.data&&value.type==="img"&&<img src={value.data} alt="" style={{width:36,height:28,objectFit:"cover",borderRadius:5,border:`1px solid ${C.border}`}}/>}
      <button onClick={()=>onChange(null)} style={{background:"none",border:"none",color:C.danger,cursor:"pointer",fontSize:14,padding:0}}>✕</button>
    </div>
  );
  return(
    <>
      <button type="button" onClick={()=>inputRef.current?.click()} style={{...ghostBtn(C.dim),fontSize:10,padding:"4px 10px"}}>{loading?"...":"📎 Adjuntar foto/PDF"}</button>
      <input ref={inputRef} type="file" accept="image/*,application/pdf" style={{display:"none"}} onChange={handle}/>
    </>
  );
}

function StorageMeter(){
  const kb=getStorageKB(); const max=4800; const pct=Math.min(100,Math.round((kb/max)*100));
  const col=pct>80?C.danger:pct>55?C.warn:C.ok;
  return(
    <div style={{margin:"12px 16px 0",background:C.card,borderRadius:12,padding:"10px 14px",border:`1px solid ${C.border}`}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
        <span style={{fontSize:10,color:C.dim,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.07em"}}>💾 Memoria app</span>
        <span style={{fontSize:10,color:col,fontWeight:700}}>{kb} KB / {Math.round(max/1024)} MB ({pct}%)</span>
      </div>
      <div style={{height:4,background:C.dim2,borderRadius:4}}><div style={{height:4,background:col,borderRadius:4,width:`${pct}%`,transition:"width 0.4s"}}/></div>
      {pct>70&&<div style={{fontSize:9,color:C.warn,marginTop:5}}>⚠️ Espacio limitado. Exporta a Drive.</div>}
    </div>
  );
}

        <div style={{display:"flex",alignItems:"center",gap:16,marginBottom:16}}>
          <div style={{width:110,height:55,borderRadius:12,overflow:"hidden",flexShrink:0,background:C.card2,border:`1px solid ${colMain}33`,display:"flex",alignItems:"center",justifyContent:"center"}}>
            {vehicle.photo?<img src={vehicle.photo} alt={vehicle.name} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<CarSVG w={110} h={50} col={colMain}/>}
          </div>
          <div>
            <div style={{fontSize:22,fontWeight:900,color:C.text,lineHeight:1.1,marginBottom:4}}>{vehicle.name||"Vehículo"}</div>
            <div style={{fontSize:12,color:C.dim}}>{vehicle.brand} {vehicle.model} {vehicle.year}</div>
            <div style={{fontSize:12,color:C.gold,fontWeight:700}}>{vehicle.plate}</div>
          </div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,paddingBottom:16}}>
          {[["Km",vehicle.currentKm?`${parseInt(vehicle.currentKm).toLocaleString("es-ES")}`:"—"],["Fuel",vehicle.fuel||"—"],["Ruedas",vehicle.tyreSummer||vehicle.tyreType||"—"],["Color",vehicle.color||"—"]].map(([k,v])=>(
            <div key={k} style={{background:C.bg+"99",borderRadius:10,padding:"8px 8px",textAlign:"center",border:`1px solid ${C.border}33`}}>
              <div style={{fontSize:9,color:C.dim,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:3}}>{k}</div>
              <div style={{fontSize:11,fontWeight:700,color:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{v}</div>
            </div>
          ))}
        </div>
      </div>
      <div style={{padding:"16px",display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
        {SECTIONS.map(sec=>{
          let statusD=null,badge=null;
          if(sec.id==="itv"){statusD=itvD;badge=itvD!==null?sLabel(itvD):null;}
          if(sec.id==="insurance"){statusD=segD;badge=segD!==null?sLabel(segD):null;}
          if(sec.id==="revisions"){const comps=vehicle.maintenanceComponents||[];const urgent=comps.filter(c=>{const{kmLeft,dayLeft}=calcNext(c,vehicle.currentKm);return(kmLeft!==null&&kmLeft<2000)||(dayLeft!==null&&dayLeft<60);}).length;badge=urgent>0?`${urgent} urgente${urgent>1?"s":""}`:comps.length>0?`${comps.length} elementos`:null;statusD=urgent>0?15:null;}
          if(sec.id==="breakdowns"){const b=vehicle.breakdowns||[];badge=`${b.length} reg.`;}
          if(sec.id==="ficha"){badge=vehicle.ficha?.marca?`${vehicle.ficha.marca}`.trim():null;}
          if(sec.id==="claims"){const cl=vehicle.claims||[];const open=cl.filter(c=>c.status==="Abierto").length;badge=open>0?`${open} abierto${open>1?"s":""}`:cl.length>0?`${cl.length} cerrado${cl.length>1?"s":""}`:null;statusD=open>0?15:null;}
          if(sec.id==="ivtm"){const nextD=daysDiff(vehicle.ivtm?.nextExpiry);statusD=nextD;badge=nextD!==null?sLabel(nextD):(vehicle.ivtmHistory||[]).length>0?`${(vehicle.ivtmHistory||[]).length} pagos`:null;}
          if(sec.id==="fuel"){const fl=vehicle.fuelLogs||[];const tot=fl.reduce((s,f)=>s+(parseFloat(f.total)||0),0);badge=fl.length>0?`${fl.length} repos · ${fmt.eur(tot)}`:null;}
          if(sec.id==="fines"){const fins=vehicle.fines||[];const pend=fins.filter(f=>f.status==="Pendiente").length;badge=pend>0?`${pend} pendiente${pend>1?"s":""}`:fins.length>0?`${fins.length} multa${fins.length>1?"s":""}`:null;statusD=pend>0?15:null;}
          if(sec.id==="gastos"){const t=calcTotals(vehicle);badge=t.total>0?fmt.eur(t.total):null;}
          const col=statusD!==null?sColor(statusD):sec.col;
          return(
            <div key={sec.id} onClick={()=>onSection(sec.id)}
              style={{background:`linear-gradient(135deg,${col}18 0%,${C.card} 100%)`,borderRadius:16,border:`1px solid ${col}44`,padding:"14px 12px",cursor:"pointer",boxShadow:`0 4px 20px ${col}12`,minHeight:95,display:"flex",flexDirection:"column",justifyContent:"space-between"}}>
              <div style={{fontSize:24,marginBottom:4}}>{sec.emoji}</div>
              <div>
                <div style={{fontSize:12,fontWeight:800,color:C.text,marginBottom:3}}>{sec.label}</div>
                {badge&&<div style={{display:"inline-flex",alignItems:"center",padding:"1px 7px",borderRadius:20,fontSize:9,fontWeight:700,background:col+"22",color:col,border:`1px solid ${col}44`}}>{badge}</div>}
              </div>
            </div>
          );
        })}
      </div>
      <GastosResumen vehicle={vehicle}/>
      {showImport&&<ImportarClaude vehicle={vehicle} onUpdate={v=>{onUpdate(v);setShowImport(false);}} onClose={()=>setShowImport(false)}/>}

    </div>
  );
}

// SECCIÓN DOCUMENTOS
// ════════════════════════════════════════════
function SectionDocs({vehicle,sectionKey,onUpdate,accent,docTypes}){
  const key=`${sectionKey}Docs`;
  const docs=vehicle[key]||[];
  const [adding,setAdding]=useState(false);
  const blank={id:"",type:docTypes[0]||"Documento",name:"",notes:"",attach:null};
  const [form,setForm]=useState(blank);
  const add=()=>{if(!form.type)return;const newDoc={...form,id:Date.now().toString()};onUpdate({...vehicle,[key]:[newDoc,...docs]});setForm(blank);setAdding(false);};
  const del=id=>onUpdate({...vehicle,[key]:docs.filter(d=>d.id!==id)});
  return(
    <SectionBlock title={`📎 Documentos (${docs.length})`} accent={accent}>
      {docs.map(d=>(
        <div key={d.id} style={{display:"flex",gap:10,alignItems:"flex-start",padding:"8px 0",borderBottom:`1px solid ${C.border}`}}>
          <span style={{fontSize:18,flexShrink:0}}>{d.attach?.type==="pdf"?"📄":d.attach?.data?"🖼️":"📎"}</span>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:12,fontWeight:700}}>{d.type}</div>
            {d.name&&<div style={{fontSize:11,color:C.dim}}>{d.name}</div>}
            {d.notes&&<div style={{fontSize:10,color:C.dim,marginTop:2}}>{d.notes}</div>}
            {d.attach&&<div style={{fontSize:9,color:d.attach.driveOnly?C.warn:C.ok,marginTop:4}}>{d.attach.driveOnly?`☁️ ${d.attach.name} · subir a Drive`:`✓ ${d.attach.name} (${d.attach.size}KB)`}</div>}
          </div>
          <button onClick={()=>del(d.id)} style={{background:"none",border:"none",color:C.danger,cursor:"pointer",fontSize:13,flexShrink:0}}>✕</button>
        </div>
      ))}
      {adding?(
        <div style={{background:C.bg,borderRadius:10,padding:12,marginTop:8,border:`1px dashed ${C.border}`}}>
          <Sel label="Tipo de documento" value={form.type} onChange={v=>setForm(p=>({...p,type:v}))} opts={docTypes.map(t=>({v:t,l:t}))}/>
          <Field label="Nombre / referencia" value={form.name} onChange={v=>setForm(p=>({...p,name:v}))} placeholder="Ej: Póliza 2025"/>
          <Field label="Notas" value={form.notes} onChange={v=>setForm(p=>({...p,notes:v}))} placeholder="Observaciones..."/>
          <div style={{marginBottom:12}}>
            <label style={{fontSize:10,color:C.dim,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em",display:"block",marginBottom:6}}>Archivo</label>
            <AttachButton value={form.attach} onChange={v=>setForm(p=>({...p,attach:v}))}/>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>setAdding(false)} style={ghostBtn(C.dim)}>Cancelar</button>
            <button onClick={add} style={{...primaryBtn(accent),flex:1}}>Guardar doc</button>
          </div>
        </div>
      ):(
        <button onClick={()=>setAdding(true)} style={{...ghostBtn(accent),marginTop:10,fontSize:11}}>+ Añadir documento</button>
      )}
    </SectionBlock>
  );
}

// ITV
// ════════════════════════════════════════════
function ITVView({vehicle,onBack,onUpdate}){
  const itv=vehicle.itv||{};
  const history=sortByDate(vehicle.itvHistory||[],"expiry");
  const itvD=daysDiff(itv.expiry);
  const col=sColor(itvD);
  const [adding,setAdding]=useState(false);
  const [form,setForm]=useState({expiry:"",result:"",price:"",station:"",stationAddress:"",notes:""});
  const itvTotal=parseFloat(itv.price||0)+history.reduce((s,r)=>s+(parseFloat(r.price)||0),0);
  const archiveCurrent=()=>{if(!itv.expiry&&!itv.result)return;onUpdate({...vehicle,itvHistory:[{...itv,archivedAt:new Date().toISOString().slice(0,10)},...history]});};
  const addHistory=()=>{onUpdate({...vehicle,itvHistory:[{...form,archivedAt:form.expiry||new Date().toISOString().slice(0,10)},...history]});setForm({expiry:"",result:"",price:"",station:"",stationAddress:"",notes:""});setAdding(false);};
  const delHistory=i=>{const h=[...history];h.splice(i,1);onUpdate({...vehicle,itvHistory:h});};
  return(
    <SectionLayout title="ITV" emoji="🔧" col={C.blue} onBack={onBack}>
      <TotalCard label="Total gastado en ITV" total={itvTotal} col={C.blue}/>
      <div style={{...heroCard(col),marginBottom:12}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div>
            <div style={{fontSize:11,color:col,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:4}}>ITV</div>
            {itv.passDate&&<div style={{fontSize:11,color:C.dim,marginBottom:2}}>Pasada: <strong style={{color:C.text}}>{fmt.date(itv.passDate)}</strong></div>}
            <div style={{fontSize:22,fontWeight:900,color:C.text}}>Caduca: {itv.expiry?fmt.date(itv.expiry):"Sin fecha"}</div>
            <div style={{fontSize:13,color:col,fontWeight:700,marginTop:2}}>{itvD!==null?`${sLabel(itvD)} (${Math.abs(itvD)} días)`:""}</div>
          </div>
          <Dot c={col} s={18}/>
        </div>
        <Div m="12px 0 10px"/>
        <div style={{display:"flex",gap:16,flexWrap:"wrap"}}>
          <InfoChip label="Resultado" val={itv.result||"—"} col={itv.result==="Favorable"?C.ok:itv.result?.includes("leves")?C.warn:itv.result==="Desfavorable"?C.danger:C.dim}/>
          <InfoChip label="Precio" val={fmt.eur(itv.price)}/>
          {itv.notifyDays&&<InfoChip label="Aviso" val={`${itv.notifyDays}d antes`}/>}
        </div>
        {(itv.station||itv.stationAddress)&&<div style={{marginTop:10}}><MapBtn addr={itv.stationAddress||itv.station} label={itv.station||"Ver estación ITV"}/></div>}
      </div>
      <SectionBlock title="📅 Historial de ITVs" accent={C.blue}>
        <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginBottom:10}}>
          <button onClick={archiveCurrent} style={ghostBtn(C.dim)}>Archivar actual</button>
          <button onClick={()=>setAdding(!adding)} style={ghostBtn(C.blue)}>+ Añadir</button>
        </div>
        {adding&&(
          <div style={{background:C.bg,borderRadius:12,padding:14,marginBottom:12,border:`1px dashed ${C.border}`}}>
            <Field label="Fecha de paso" type="date" value={form.passDate||""} onChange={v=>setForm(p=>({...p,passDate:v}))}/>
            <Field label="Fecha caducidad" type="date" value={form.expiry} onChange={v=>setForm(p=>({...p,expiry:v}))}/>
            <Sel label="Resultado" value={form.result} onChange={v=>setForm(p=>({...p,result:v}))} opts={[{v:"",l:"— Sin especificar"},{v:"Favorable",l:"✅ Favorable"},{v:"Favorable con defectos leves",l:"⚠️ Con defectos leves"},{v:"Desfavorable",l:"❌ Desfavorable"},{v:"Negativa",l:"🚫 Negativa"}]}/>
            <Field label="Precio (€)" type="number" value={form.price} onChange={v=>setForm(p=>({...p,price:v}))} placeholder="0.00"/>
            <Field label="Estación" value={form.station} onChange={v=>setForm(p=>({...p,station:v}))} placeholder="Nombre estación ITV"/>
            <Field label="Dirección" value={form.stationAddress} onChange={v=>setForm(p=>({...p,stationAddress:v}))} placeholder="Para abrir en mapa"/>
            <Field label="Notas" value={form.notes} onChange={v=>setForm(p=>({...p,notes:v}))} placeholder="Observaciones..."/>
            <div style={{display:"flex",gap:8,marginTop:4}}>
              <button onClick={()=>setAdding(false)} style={ghostBtn(C.dim)}>Cancelar</button>
              <button onClick={addHistory} style={primaryBtn(C.blue)}>Guardar</button>
            </div>
          </div>
        )}
        <HistoryTable rows={history} cols={[{k:"expiry",l:"Fecha",fmt:fmt.date,bold:true},{k:"result",l:"Resultado",color:v=>v==="Favorable"?C.ok:v?.includes("leves")?C.warn:v==="Desfavorable"?C.danger:C.dim},{k:"price",l:"Precio",fmt:fmt.eur},{k:"station",l:"Estación",maxW:"80px",wrap:true}]} onDelete={delHistory}/>
      </SectionBlock>
      <SectionDocs vehicle={vehicle} sectionKey="itv" onUpdate={onUpdate} accent={C.blue} docTypes={["Tarjeta ITV","Informe de inspección","Justificante de pago","Cita previa","Otro"]}/>
    </SectionLayout>
  );
}

      <div style={{...heroCard(col),marginBottom:12}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>

            <div style={{fontSize:11,color:col,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:4}}>{ins.type||"Seguro"}</div>
            <div style={{fontSize:22,fontWeight:900,color:C.text}}>{ins.company||"Sin compañía"}</div>
            <div style={{fontSize:13,color:col,fontWeight:700,marginTop:2}}>{ins.expiry?`Vence ${fmt.date(ins.expiry)} · ${sLabel(segD)}`:""}</div>

          <InfoChip label="Mensual" val={ins.price?fmt.eur(parseFloat(ins.price)/12):"—"}/>
          {ins.policyNum&&<InfoChip label="Póliza" val={ins.policyNum}/>}
        </div>
        {ins.promotions&&<div style={{marginTop:10,fontSize:12,color:C.ok,fontWeight:600}}>🎁 {ins.promotions}</div>}

      {(ins.appName||ins.appUrl)&&(
        <div style={{background:C.card,borderRadius:14,padding:14,marginBottom:12,border:`1px solid ${C.border}`}}>
          <div style={{fontSize:12,fontWeight:700,color:C.purple,marginBottom:8}}>📱 App de la aseguradora</div>

            <Field label="Prima anual (€)" type="number" value={form.price} onChange={v=>setForm(p=>({...p,price:v}))} placeholder="0.00"/>

      </SectionBlock>
      <SectionDocs vehicle={vehicle} sectionKey="insurance" onUpdate={onUpdate} accent={C.purple} docTypes={["Póliza del seguro","Certificado del seguro","Recibo / factura","Carta verde","Declaración amistosa","Otro"]}/>

  );
}

const IVTM_COL="#c0392b";
function IVTMView({vehicle,onBack,onUpdate}){
  const ivtm=vehicle.ivtm||{};
  const history=sortByDate(vehicle.ivtmHistory||[],"date");
  const nextD=daysDiff(ivtm.nextExpiry);
  const col=nextD!==null?sColor(nextD):IVTM_COL;
  const [adding,setAdding]=useState(false);
  const blank={year:"",date:"",price:"",municipality:"",reference:"",notes:""};
  const [form,setForm]=useState(blank);
  const total=parseFloat(ivtm.price||0)+history.reduce((s,r)=>s+(parseFloat(r.price)||0),0);
  const archiveCurrent=()=>{if(!ivtm.price&&!ivtm.year)return;onUpdate({...vehicle,ivtmHistory:[{...ivtm,archivedAt:new Date().toISOString().slice(0,10)},...history]});};
  const addHistory=()=>{onUpdate({...vehicle,ivtmHistory:[{...form,archivedAt:form.date||new Date().toISOString().slice(0,10)},...history]});setForm(blank);setAdding(false);};
  const delHistory=i=>{const h=[...history];h.splice(i,1);onUpdate({...vehicle,ivtmHistory:h});};

            {ivtm.year&&<div style={{fontSize:13,color:C.dim,marginTop:2}}>Ejercicio {ivtm.year}</div>}
            {ivtm.nextExpiry&&<div style={{fontSize:13,color:col,fontWeight:700,marginTop:4}}>Próx. vto: {fmt.date(ivtm.nextExpiry)} · {sLabel(nextD)}</div>}
          </div>
          <Dot c={col} s={18}/>
        </div>
        <Div m="12px 0 10px"/>
        <div style={{display:"flex",gap:16,flexWrap:"wrap"}}>

        <Field label="Municipio recaudador" value={ivtm.municipality} onChange={v=>onUpdate({...vehicle,ivtm:{...ivtm,municipality:v}})} placeholder="Ej: Parla"/>
        <Field label="Nº referencia / recibo" value={ivtm.reference} onChange={v=>onUpdate({...vehicle,ivtm:{...ivtm,reference:v}})} placeholder="Ej: 2025-IVT-12345"/>

            <Field label="Municipio" value={form.municipality} onChange={v=>setForm(p=>({...p,municipality:v}))} placeholder="Ej: Parla"/>
            <Field label="Nº referencia" value={form.reference} onChange={v=>setForm(p=>({...p,reference:v}))} placeholder="Opcional"/>

}

// REVISIONES
// ════════════════════════════════════════════
function RevisionsView({vehicle,onBack,onUpdate}){
  const currentKm=parseInt(vehicle.currentKm)||null;
  const components=vehicle.maintenanceComponents||[];
  const[view,setView]=useState("list");
  const[selComp,setSelComp]=useState(null);
  const revisions=sortByDate(vehicle.revisions||[],"date");
  const[addingRev,setAddingRev]=useState(false);
  const blankRev={id:"",name:"",date:"",km:"",price:"",workshop:"",workshopAddress:"",notes:"",bills:[]};
  const[formRev,setFormRev]=useState(blankRev);
  const[expandedRev,setExpandedRev]=useState(null);
  const[billFormRev,setBillFormRev]=useState({concept:"",date:"",amount:""});

  useEffect(()=>{
    if(components.length===0){
      const init=ESPACE_COMPONENTS.map(c=>({...c,lastKm:"",lastDate:"",lastPrice:"",lastWorkshop:"",history:[]}));
      onUpdate({...vehicle,maintenanceComponents:init});
    }
  },[]);

  const saveComp=comp=>{
    const list=[...components];
    const idx=list.findIndex(c=>c.id===comp.id);
    if(idx>=0)list[idx]=comp;else list.push(comp);
    onUpdate({...vehicle,maintenanceComponents:list});
    setView("list");setSelComp(null);
  };
  const delComp=id=>{onUpdate({...vehicle,maintenanceComponents:components.filter(c=>c.id!==id)});setView("list");setSelComp(null);};
  const addRev=()=>{onUpdate({...vehicle,revisions:[{...formRev,id:Date.now().toString()},...revisions]});setFormRev(blankRev);setAddingRev(false);};
  const delRev=id=>onUpdate({...vehicle,revisions:revisions.filter(r=>r.id!==id)});
  const addBillRev=idx=>{if(!billFormRev.amount)return;const list=[...revisions];list[idx]={...list[idx],bills:[...(list[idx].bills||[]),{...billFormRev}]};onUpdate({...vehicle,revisions:list});setBillFormRev({concept:"",date:"",amount:""});};
  const delBillRev=(rIdx,bIdx)=>{const list=[...revisions];list[rIdx]={...list[rIdx],bills:list[rIdx].bills.filter((_,i)=>i!==bIdx)};onUpdate({...vehicle,revisions:list});};
  const addRev=()=>{onUpdate({...vehicle,revisions:[{...formRev,id:Date.now().toString()},...revisions]});setFormRev(blankRev);setAddingRev(false);};
  const delRev=id=>onUpdate({...vehicle,revisions:revisions.filter(r=>r.id!==id)});
  const addBillRev=idx=>{if(!billFormRev.amount)return;const list=[...revisions];list[idx]={...list[idx],bills:[...(list[idx].bills||[]),{...billFormRev}]};onUpdate({...vehicle,revisions:list});setBillFormRev({concept:"",date:"",amount:""});};
  const delBillRev=(rIdx,bIdx)=>{const list=[...revisions];list[rIdx]={...list[rIdx],bills:list[rIdx].bills.filter((_,i)=>i!==bIdx)};onUpdate({...vehicle,revisions:list});};
  const registerChange=(comp,override={})=>{
    const entry={date:override.date||new Date().toISOString().slice(0,10),km:override.km||vehicle.currentKm||"",price:override.price||"",workshop:override.workshop||"",notes:override.notes||""};
    const updated={...comp,lastDate:entry.date,lastKm:entry.km,lastPrice:entry.price,lastWorkshop:entry.workshop,history:[entry,...(comp.history||[])]};
    saveComp(updated);
  };

  const totalGasto=components.reduce((s,c)=>s+(c.history||[]).reduce((t,h)=>t+(parseFloat(h.price)||0),0),0)+revisions.reduce((s,r)=>s+(parseFloat(r.price)||0),0);
  const sorted=[...components].map(c=>({...c,_calc:calcNext(c,currentKm)})).sort((a,b)=>a._calc.urgent-b._calc.urgent);

  if(view==="component"&&selComp) return <ComponentView comp={selComp} currentKm={currentKm} vehicle={vehicle} onSave={saveComp} onDelete={delComp} onBack={()=>{setView("list");setSelComp(null);}} onRegisterChange={registerChange}/>;
  if(view==="add") return <ComponentEditForm comp={{id:Date.now().toString(),name:"",emoji:"🔧",intervalKm:"",intervalMonths:"",category:"",notes:"",lastKm:"",lastDate:"",lastPrice:"",lastWorkshop:"",history:[]}} onSave={c=>{saveComp(c);setView("list");}} onCancel={()=>setView("list")}/>;

  const categories=[...new Set(sorted.map(c=>c.category||"Otros"))];
  const nextServiceItems=sorted.filter(c=>{const{kmLeft,dayLeft}=c._calc;return(kmLeft!==null&&kmLeft<=5000)||(dayLeft!==null&&dayLeft<=60);}).slice(0,6);
  const overdue=sorted.filter(c=>{const{kmLeft,dayLeft}=c._calc;return(kmLeft!==null&&kmLeft<0)||(dayLeft!==null&&dayLeft<0);});

  return(
    <SectionLayout title="Mantenimiento" emoji="⚙️" col={C.teal} onBack={onBack}>
      <TotalCard label="Total gastado en mantenimiento" total={totalGasto} col={C.teal}/>
      {(nextServiceItems.length>0||overdue.length>0)&&(
        <div style={{background:C.card,borderRadius:16,padding:16,marginBottom:14,border:`1px solid ${C.teal}33`}}>
          {overdue.length>0&&(
            <div style={{background:`${C.danger}10`,border:`1px solid ${C.danger}30`,borderRadius:12,padding:"10px 14px",marginBottom:12}}>
              <div style={{fontSize:12,fontWeight:800,color:C.danger,marginBottom:8}}>🚨 Vencido — cambiar ya</div>
              {overdue.map(c=>(
                <div key={c.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5,paddingBottom:5,borderBottom:`1px solid ${C.border}`}}>
                  <span style={{fontSize:13}}>{c.emoji} <strong>{c.name}</strong></span>
                  <div style={{display:"flex",gap:5}}>
                    {c._calc.kmLeft!==null&&c._calc.kmLeft<0&&<Pill c={C.danger}>+{Math.abs(c._calc.kmLeft).toLocaleString("es-ES")} km</Pill>}
                    {c._calc.dayLeft!==null&&c._calc.dayLeft<0&&<Pill c={C.danger}>+{Math.abs(c._calc.dayLeft)}d</Pill>}
                  </div>
                </div>
              ))}
            </div>
          )}
          {nextServiceItems.length>0&&(
            <>
              <div style={{fontSize:12,fontWeight:800,color:C.teal,marginBottom:10}}>🔧 Próximos cambios</div>
              {nextServiceItems.map((c,i)=>{
                const{kmLeft,dayLeft,nextKm,nextDate}=c._calc;
                const col2=(kmLeft!==null&&kmLeft<=1000)||(dayLeft!==null&&dayLeft<=14)?C.warn:C.teal;
                const pct=kmLeft!==null&&currentKm&&c.intervalKm?Math.max(0,Math.min(100,100-(kmLeft/c.intervalKm*100))):dayLeft!==null&&c.intervalMonths?Math.max(0,Math.min(100,100-(dayLeft/(c.intervalMonths*30)*100))):null;
                return(
                  <div key={c.id} onClick={()=>{setSelComp(c);setView("component");}} style={{padding:"10px 0",borderBottom:i<nextServiceItems.length-1?`1px solid ${C.border}`:0,cursor:"pointer"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                      <span style={{fontSize:13,fontWeight:700}}>{c.emoji} {c.name}</span>
                      <div style={{display:"flex",gap:5}}>
                        {kmLeft!==null&&<Pill c={kColor(kmLeft)}>{kLabel(kmLeft)}</Pill>}
                        {dayLeft!==null&&<Pill c={sColor(dayLeft)}>{sLabel(dayLeft)}</Pill>}
                      </div>
                    </div>
                    {pct!==null&&<div style={{height:5,background:C.dim2,borderRadius:5,overflow:"hidden"}}><div style={{height:5,background:`linear-gradient(90deg,${C.ok},${col2})`,width:`${pct}%`,borderRadius:5}}/></div>}
                    <div style={{fontSize:10,color:C.dim,marginTop:4}}>{nextKm&&`Toca a los ${fmt.km(nextKm)}`}{nextKm&&nextDate?" · ":""}{nextDate&&`antes de ${fmt.date(nextDate)}`}</div>
                  </div>
                );
              })}
            </>
          )}
        </div>
      )}
      {nextServiceItems.length===0&&overdue.length===0&&components.length>0&&(
        <div style={{background:`${C.ok}10`,border:`1px solid ${C.ok}33`,borderRadius:14,padding:"14px 16px",marginBottom:14,display:"flex",alignItems:"center",gap:12}}>
          <span style={{fontSize:28}}>✅</span>
          <div><div style={{fontSize:13,fontWeight:800,color:C.ok}}>Todo al día</div><div style={{fontSize:11,color:C.dim}}>Ningún elemento en los próximos 60 días / 5.000 km</div></div>
        </div>
      )}
      {categories.map(cat=>(
        <div key={cat}>
          <div style={{fontSize:10,fontWeight:700,color:C.dim,textTransform:"uppercase",letterSpacing:"0.08em",margin:"12px 0 6px",paddingLeft:2}}>{cat}</div>
          {sorted.filter(c=>(c.category||"Otros")===cat).map(c=>{
            const{kmLeft,dayLeft}=c._calc;
            const worstCol=kmLeft!==null&&dayLeft!==null?(kmLeft<dayLeft*50?kColor(kmLeft):sColor(dayLeft)):kmLeft!==null?kColor(kmLeft):dayLeft!==null?sColor(dayLeft):C.teal;
            const neverChanged=!c.lastDate&&!c.lastKm;
            return(
              <div key={c.id} onClick={()=>{setSelComp(c);setView("component");}} style={{background:C.card,borderRadius:14,padding:"12px 14px",marginBottom:8,border:`1px solid ${C.border}`,borderLeft:`3px solid ${worstCol}`,cursor:"pointer"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                  <div style={{flex:1}}>
                    <div style={{fontSize:13,fontWeight:800,marginBottom:3}}>{c.emoji} {c.name}</div>
                    {neverChanged?<div style={{fontSize:10,color:C.warn}}>⚠️ Sin registro de último cambio</div>:<div style={{fontSize:10,color:C.dim}}>Último: {fmt.date(c.lastDate)}{c.lastKm?` · ${fmt.km(c.lastKm)}`:""}</div>}
                  </div>
                  <Dot c={worstCol} s={10}/>
                </div>
                {!neverChanged&&(
                  <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:7}}>
                    {c._calc.nextKm&&currentKm&&<Pill c={kColor(kmLeft)}>{kLabel(kmLeft)}</Pill>}
                    {c._calc.nextDate&&<Pill c={sColor(dayLeft)}>{sLabel(dayLeft)}</Pill>}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      ))}
      <div style={{display:"flex",gap:10,marginTop:8,paddingBottom:80}}>
        <button onClick={()=>setView("add")} style={{...primaryBtn(C.teal),flex:1}}>+ Añadir elemento</button>
      </div>
      <SectionDocs vehicle={vehicle} sectionKey="revisions" onUpdate={onUpdate} accent={C.teal} docTypes={["Factura de revisión","Presupuesto","Albarán taller","Garantía de piezas","Otro"]}/>
    </SectionLayout>
  );
}

function ComponentView({comp,currentKm,vehicle,onSave,onDelete,onBack,onRegisterChange}){
  const{kmLeft,dayLeft,nextKm,nextDate}=calcNext(comp,currentKm);
  const[editing,setEditing]=useState(false);
  const[registering,setRegistering]=useState(false);
  const[changeForm,setChangeForm]=useState({date:new Date().toISOString().slice(0,10),km:vehicle.currentKm||"",price:"",workshop:"",notes:""});
  const worstCol=kmLeft!==null&&dayLeft!==null?(kmLeft<dayLeft*50?kColor(kmLeft):sColor(dayLeft)):kmLeft!==null?kColor(kmLeft):dayLeft!==null?sColor(dayLeft):C.teal;
  if(editing) return <ComponentEditForm comp={comp} onSave={c=>{onSave(c);}} onCancel={()=>setEditing(false)}/>;
  return(
    <SectionLayout title={comp.name} emoji={comp.emoji||"⚙️"} col={worstCol} onBack={onBack}>
      <div style={{...heroCard(worstCol),marginBottom:12}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
          <div><div style={{fontSize:32,marginBottom:4}}>{comp.emoji}</div><div style={{fontSize:17,fontWeight:900,color:C.text}}>{comp.name}</div>{comp.category&&<div style={{fontSize:11,color:C.dim,marginTop:2}}>{comp.category}</div>}</div>
          <div style={{display:"flex",gap:6}}>
            <button onClick={()=>setEditing(true)} style={ghostBtn(C.teal)}>✏️</button>
            <button onClick={()=>{if(confirm("¿Eliminar este elemento?"))onDelete(comp.id);}} style={ghostBtn(C.danger)}>🗑️</button>
          </div>
        </div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:10}}>
          {nextKm&&currentKm&&<Pill c={kColor(kmLeft)}>{kmLeft>=0?"Faltan":"Superado hace"} {Math.abs(kmLeft).toLocaleString("es-ES")} km → {fmt.km(nextKm)}</Pill>}
          {nextDate&&<Pill c={sColor(dayLeft)}>{dayLeft>=0?"Faltan":"Hace"} {Math.abs(dayLeft)}d → {fmt.date(nextDate)}</Pill>}
          {!nextKm&&!nextDate&&!comp.lastDate&&!comp.lastKm&&<Pill c={C.warn}>⚠️ Sin datos de último cambio</Pill>}
        </div>
        <div style={{display:"flex",gap:14,flexWrap:"wrap"}}>
          {comp.intervalKm&&<InfoChip label="Cada" val={`${parseInt(comp.intervalKm).toLocaleString("es-ES")} km`} col={C.teal}/>}
          {comp.intervalMonths&&<InfoChip label="Cada" val={`${comp.intervalMonths} meses`} col={C.teal}/>}
        </div>
        {comp.notes&&<div style={{marginTop:8,fontSize:11,color:C.dim,fontStyle:"italic"}}>ℹ️ {comp.notes}</div>}
      </div>
      {(comp.lastDate||comp.lastKm)&&(
        <div style={{background:C.card,borderRadius:12,padding:"12px 14px",marginBottom:12,border:`1px solid ${C.border}`}}>
          <div style={{fontSize:10,fontWeight:700,color:C.dim,textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:8}}>🔙 Último cambio</div>
          <div style={{display:"flex",gap:16,flexWrap:"wrap"}}>
            {comp.lastDate&&<InfoChip label="Fecha" val={fmt.date(comp.lastDate)}/>}
            {comp.lastKm&&<InfoChip label="Km" val={fmt.km(comp.lastKm)}/>}
            {comp.lastPrice&&<InfoChip label="Precio" val={fmt.eur(comp.lastPrice)} col={C.gold}/>}
            {comp.lastWorkshop&&<InfoChip label="Taller" val={comp.lastWorkshop}/>}
          </div>

      {registering&&(
        <div style={{background:"#27ae6018",border:`1px solid ${C.ok}44`,borderRadius:14,padding:14,marginBottom:12}}>

          <Field label="Km en el cambio" type="number" value={changeForm.km} onChange={v=>setChangeForm(p=>({...p,km:v}))} placeholder={vehicle.currentKm||""}/>
          <Field label="Precio (€)" type="number" value={changeForm.price} onChange={v=>setChangeForm(p=>({...p,price:v}))} placeholder="0.00"/>
          <Field label="Taller" value={changeForm.workshop} onChange={v=>setChangeForm(p=>({...p,workshop:v}))} placeholder="Ej: Taller Pepe"/>
          <Field label="Notas" value={changeForm.notes} onChange={v=>setChangeForm(p=>({...p,notes:v}))} placeholder="Marca, referencia..."/>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>setRegistering(false)} style={{...ghostBtn(C.dim),flex:1,justifyContent:"center"}}>Cancelar</button>
            <button onClick={()=>{onRegisterChange(comp,changeForm);setRegistering(false);}} style={{...primaryBtn(C.ok),flex:2}}>💾 Guardar cambio</button>
          </div>
        </div>
      )}
      {(comp.history||[]).length>0&&(
        <SectionBlock title={`📅 Historial de cambios (${comp.history.length})`} accent={C.teal}>
          <HistoryTable rows={comp.history} cols={[{k:"date",l:"Fecha",fmt:fmt.date,bold:true},{k:"km",l:"Km",fmt:v=>v?fmt.km(v):"—"},{k:"price",l:"€",fmt:fmt.eur,col:()=>C.gold},{k:"workshop",l:"Taller",maxW:"70px",wrap:true}]}
            onDelete={i=>{const h=[...(comp.history||[])];h.splice(i,1);const updated={...comp,history:h};if(h.length>0){updated.lastDate=h[0].date;updated.lastKm=h[0].km;updated.lastPrice=h[0].price;updated.lastWorkshop=h[0].workshop;}else{updated.lastDate="";updated.lastKm="";updated.lastPrice="";updated.lastWorkshop="";}onSave(updated);}}/>
        </SectionBlock>
      )}
    </SectionLayout>
  );
}

function BreakdownsView({vehicle,onBack,onUpdate}){
  const bds=sortByDate(vehicle.breakdowns||[],"date");
  const[adding,setAdding]=useState(false);
  const[expanded,setExpanded]=useState(null);
  const[billForm,setBillForm]=useState({concept:"",date:"",amount:"",attach:null});
  const blank={description:"",workshop:"",workshopAddress:"",date:"",price:"",notes:"",bills:[],id:""};
  const[form,setForm]=useState(blank);
  const totalGasto=bds.reduce((s,b)=>{const bTotal=(b.bills||[]).reduce((t,bi)=>t+(parseFloat(bi.amount)||0),0);return s+(parseFloat(b.price)||bTotal||0);},0);
  const add=()=>{onUpdate({...vehicle,breakdowns:[{...form,id:Date.now().toString()},...bds]});setForm(blank);setAdding(false);};
  const del=id=>onUpdate({...vehicle,breakdowns:bds.filter(b=>b.id!==id)});
  const addBill=idx=>{if(!billForm.amount)return;const list=[...bds];list[idx]={...list[idx],bills:[...(list[idx].bills||[]),{...billForm}]};onUpdate({...vehicle,breakdowns:list});setBillForm({concept:"",date:"",amount:"",attach:null});};
  const delBill=(bIdx,biIdx)=>{const list=[...bds];list[bIdx]={...list[bIdx],bills:list[bIdx].bills.filter((_,i)=>i!==biIdx)};onUpdate({...vehicle,breakdowns:list});};
  return(
    <SectionLayout title="Averías" emoji="🔩" col={C.warn} onBack={onBack}>
      {bds.length>0&&<div style={{background:C.card,borderRadius:14,padding:"12px 16px",marginBottom:12,border:`1px solid ${C.border}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontSize:12,color:C.dim}}>Gasto total acumulado</span><span style={{fontSize:20,fontWeight:900,color:C.danger}}>{fmt.eur(totalGasto)}</span></div>}
      {bds.length===0&&!adding&&<div style={{textAlign:"center",padding:"40px 20px",color:C.dim}}><div style={{fontSize:36,marginBottom:8}}>🔩</div><div>Sin averías registradas</div></div>}
      {bds.map((b,i)=>{
        const billTotal=(b.bills||[]).reduce((s,bi)=>s+(parseFloat(bi.amount)||0),0);
        const exp=expanded===i;
        return(
          <div key={b.id} style={{background:C.card,borderRadius:14,padding:14,marginBottom:10,border:`1px solid ${C.border}`,borderLeft:`3px solid ${C.danger}`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
              <div style={{flex:1}}><div style={{fontSize:14,fontWeight:800,marginBottom:2}}>{b.description||"Sin descripción"}</div><div style={{fontSize:11,color:C.dim}}>{b.workshop?`${b.workshop} · `:""}{fmt.date(b.date)}</div></div>
              <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0}}><Pill c={C.danger}>{fmt.eur(parseFloat(b.price)||billTotal)}</Pill><button onClick={()=>del(b.id)} style={ghostBtn(C.danger)}>✕</button></div>
            </div>
            {b.workshopAddress&&<div style={{marginBottom:8}}><MapBtn addr={b.workshopAddress} label={b.workshop||"Ver taller"}/></div>}
            {b.notes&&<div style={{fontSize:11,color:C.dim,marginBottom:6}}>{b.notes}</div>}
            <button onClick={()=>setExpanded(exp?null:i)} style={{...ghostBtn(C.warn),fontSize:11,padding:"4px 10px"}}>🧾 {(b.bills||[]).length} factura{(b.bills||[]).length!==1?"s":""}{billTotal>0?` · ${fmt.eur(billTotal)}`:""} {exp?"▲":"▼"}</button>
            {exp&&(
              <div style={{marginTop:10,background:C.bg,borderRadius:10,padding:10}}>
                {(b.bills||[]).map((bi,bi_i)=>(
                  <div key={bi_i} style={{padding:"8px 0",borderBottom:`1px solid ${C.border}`}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                      <div><div style={{fontSize:12,fontWeight:600}}>{bi.concept||"Factura"}</div><div style={{fontSize:10,color:C.dim}}>{fmt.date(bi.date)}</div></div>
                      <div style={{display:"flex",alignItems:"center",gap:8}}><span style={{fontSize:13,fontWeight:700}}>{fmt.eur(bi.amount)}</span><button onClick={()=>delBill(i,bi_i)} style={{background:"none",border:"none",color:C.danger,cursor:"pointer",fontSize:11}}>✕</button></div>
                    </div>
                  </div>
                ))}
                <div style={{display:"flex",gap:6,marginTop:8,flexWrap:"wrap"}}>
                  <input placeholder="Concepto" value={billForm.concept} onChange={e=>setBillForm(p=>({...p,concept:e.target.value}))} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:"6px 9px",color:C.text,fontSize:11,outline:"none",flex:2,minWidth:80}}/>
                  <input type="date" value={billForm.date} onChange={e=>setBillForm(p=>({...p,date:e.target.value}))} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:"6px 9px",color:C.text,fontSize:11,outline:"none",flex:1,minWidth:90}}/>
                  <input type="number" placeholder="€" value={billForm.amount} onChange={e=>setBillForm(p=>({...p,amount:e.target.value}))} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:"6px 9px",color:C.text,fontSize:11,outline:"none",flex:1,minWidth:55}}/>
                  <button onClick={()=>addBill(i)} style={{...primaryBtn(C.warn),padding:"6px 14px",fontSize:11,borderRadius:8}}>+ Añadir</button>
                </div>
              </div>
            )}
          </div>
        );
      })}
      {adding?(
        <div style={{background:C.card,borderRadius:14,padding:14,border:`1px dashed ${C.border}`}}>
          <div style={{fontSize:11,fontWeight:700,color:C.warn,marginBottom:12,textTransform:"uppercase",letterSpacing:"0.06em"}}>+ Nueva avería</div>
          <Field label="Avería / descripción" value={form.description} onChange={v=>setForm(p=>({...p,description:v}))} placeholder="Ej: Embrague desgastado"/>
          <Field label="Taller" value={form.workshop} onChange={v=>setForm(p=>({...p,workshop:v}))} placeholder="Nombre del taller"/>
          <Field label="Dirección del taller" value={form.workshopAddress} onChange={v=>setForm(p=>({...p,workshopAddress:v}))} placeholder="Para abrir en Google Maps"/>
          <Field label="Fecha" type="date" value={form.date} onChange={v=>setForm(p=>({...p,date:v}))}/>
          <Field label="Coste total (€)" type="number" value={form.price} onChange={v=>setForm(p=>({...p,price:v}))} placeholder="0.00"/>
          <Field label="Notas" value={form.notes} onChange={v=>setForm(p=>({...p,notes:v}))} placeholder="Observaciones..."/>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>setAdding(false)} style={ghostBtn(C.dim)}>Cancelar</button>
            <button onClick={add} style={{...primaryBtn(C.warn),flex:1}}>Añadir avería</button>
          </div>
        </div>
      ):<button onClick={()=>setAdding(true)} style={{...ghostBtn(C.warn),width:"100%",justifyContent:"center"}}>+ Añadir avería</button>}
      <SectionDocs vehicle={vehicle} sectionKey="breakdowns" onUpdate={onUpdate} accent={C.warn} docTypes={["Factura del taller","Presupuesto","Fotografías del daño","Informe perito","Garantía de reparación","Otro"]}/>
    </SectionLayout>
  );
}

  const blank={date:"",liters:"",pricePerL:"",total:"",km:"",station:"",fuelType:"",notes:""};
  const[form,setForm]=useState(blank);
  const updForm=(k,v)=>{setForm(p=>{const next={...p,[k]:v};if((k==="liters"||k==="pricePerL")&&next.liters&&next.pricePerL){next.total=(parseFloat(next.liters)*parseFloat(next.pricePerL)).toFixed(2);}return next;});};
  const totalGasto=logs.reduce((s,l)=>s+(parseFloat(l.total)||0),0);
  const totalLitros=logs.reduce((s,l)=>s+(parseFloat(l.liters)||0),0);
  const consumMedio=(()=>{const wk=logs.filter(l=>l.km&&l.liters);if(wk.length<2)return null;const sorted=[...wk].sort((a,b)=>parseInt(a.km)-parseInt(b.km));const kmD2=parseInt(sorted[sorted.length-1].km)-parseInt(sorted[0].km);const litTot=sorted.slice(1).reduce((s,l)=>s+(parseFloat(l.liters)||0),0);return kmD2>0?(litTot/kmD2*100).toFixed(1):null;})();
  const add=()=>{onUpdate({...vehicle,fuelLogs:[{...form,id:Date.now().toString()},...logs]});setForm(blank);setAdding(false);};
  const del=id=>onUpdate({...vehicle,fuelLogs:logs.filter(l=>l.id!==id)});
  return(
    <SectionLayout title="Combustible" emoji="⛽" col={FUEL_COL} onBack={onBack}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:12}}>
        {[{l:"Total gastado",v:fmt.eur(totalGasto),c:C.gold},{l:"Litros totales",v:totalLitros>0?`${totalLitros.toFixed(0)}L`:"—",c:FUEL_COL},{l:"Consumo medio",v:consumMedio?`${consumMedio}L/100km`:"—",c:C.teal}].map(s=>(
          <div key={s.l} style={{background:C.card,borderRadius:12,padding:"10px 10px",border:`1px solid ${C.border}`,textAlign:"center"}}>
            <div style={{fontSize:9,color:C.dim,marginBottom:3,textTransform:"uppercase",letterSpacing:"0.07em"}}>{s.l}</div>
            <div style={{fontSize:13,fontWeight:800,color:s.c}}>{s.v}</div>
          </div>
        ))}
      </div>
      {logs.length===0&&!adding&&<div style={{textAlign:"center",padding:"40px 20px",color:C.dim}}><div style={{fontSize:36,marginBottom:8}}>⛽</div><div>Sin repostajes registrados</div></div>}
      {logs.map(l=>(
        <div key={l.id} style={{background:C.card,borderRadius:14,padding:14,marginBottom:10,border:`1px solid ${C.border}`,borderLeft:`3px solid ${FUEL_COL}`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6}}>
            <div><div style={{fontSize:14,fontWeight:800}}>{fmt.date(l.date)||"Sin fecha"}{l.fuelType?` · ${l.fuelType}`:""}</div><div style={{fontSize:11,color:C.dim}}>{l.station||""}{l.km?` · ${fmt.km(l.km)}`:""}</div></div>
            <div style={{display:"flex",alignItems:"center",gap:8}}><Pill c={FUEL_COL}>{fmt.eur(l.total)}</Pill><button onClick={()=>del(l.id)} style={ghostBtn(C.danger)}>✕</button></div>
          </div>
          <div style={{display:"flex",gap:14,flexWrap:"wrap"}}>
            {l.liters&&<InfoChip label="Litros" val={`${l.liters} L`}/>}
            {l.pricePerL&&<InfoChip label="€/Litro" val={`${parseFloat(l.pricePerL).toFixed(3)} €`}/>}
            {l.notes&&<InfoChip label="Notas" val={l.notes}/>}
          </div>
        </div>
      ))}
      {adding?(
        <div style={{background:C.card,borderRadius:14,padding:14,border:`1px dashed ${C.border}`}}>
          <div style={{fontSize:11,fontWeight:700,color:FUEL_COL,marginBottom:12,textTransform:"uppercase",letterSpacing:"0.06em"}}>+ Nuevo repostaje</div>
          <Field label="Fecha" type="date" value={form.date} onChange={v=>updForm("date",v)}/>
          <div style={{display:"flex",gap:10}}>
            <div style={{flex:1}}><Field label="Litros" type="number" value={form.liters} onChange={v=>updForm("liters",v)} placeholder="0.00"/></div>
            <div style={{flex:1}}><Field label="€ / litro" type="number" value={form.pricePerL} onChange={v=>updForm("pricePerL",v)} placeholder="1.650"/></div>
          </div>
          <Field label="Total (€) — se calcula solo" type="number" value={form.total} onChange={v=>updForm("total",v)} placeholder="0.00"/>
          <Field label="Km al repostar" type="number" value={form.km} onChange={v=>updForm("km",v)} placeholder="Para calcular consumo"/>
          <Sel label="Tipo de combustible" value={form.fuelType} onChange={v=>updForm("fuelType",v)} opts={[{v:"",l:"— Sin especificar"},{v:"Gasolina 95",l:"Gasolina 95"},{v:"Gasolina 98",l:"Gasolina 98"},{v:"Diésel",l:"Diésel"},{v:"Diésel Plus",l:"Diésel Plus"},{v:"GLP",l:"GLP"},{v:"Adblue",l:"Adblue"}]}/>
          <Field label="Gasolinera" value={form.station} onChange={v=>updForm("station",v)} placeholder="Ej: Repsol Parla"/>
          <Field label="Notas" value={form.notes} onChange={v=>updForm("notes",v)} placeholder="Observaciones..."/>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>setAdding(false)} style={ghostBtn(C.dim)}>Cancelar</button>
            <button onClick={add} style={{...primaryBtn(FUEL_COL),flex:1}}>Guardar repostaje</button>
          </div>
        </div>
      ):<button onClick={()=>setAdding(true)} style={{...ghostBtn(FUEL_COL),width:"100%",justifyContent:"center",marginBottom:8}}>+ Añadir repostaje</button>}
    </SectionLayout>
  );
}

// ESCÁNER
// ════════════════════════════════════════════
const SCAN_DESTINATIONS=[
  {id:"itv",label:"🔧 ITV",hint:"Tarjeta ITV, informe inspección, cita previa"},
  {id:"insurance",label:"🛡️ Seguro",hint:"Póliza, recibo, certificado, carta verde"},
  {id:"ivtm",label:"🏛️ IVTM",hint:"Recibo de pago del impuesto"},
  {id:"revisions",label:"⚙️ Revisión",hint:"Factura de taller, albarán, presupuesto"},
  {id:"breakdowns",label:"🔩 Avería",hint:"Factura reparación, presupuesto, garantía"},
  {id:"claims",label:"📋 Parte del seguro",hint:"Declaración amistosa, informe perito, factura"},
  {id:"fuel",label:"⛽ Combustible",hint:"Ticket repostaje"},
];

const EXTRACT_SYSTEM=`Eres un asistente especializado en documentos de vehículos españoles. Analiza la imagen y extrae TODOS los datos visibles. Responde SOLO con un JSON sin backticks con esta estructura:
{"tipoDoc":"tipo de documento detectado en español","destino":"uno de: itv, insurance, ivtm, revisions, breakdowns, claims, fuel","confianza":"alta|media|baja","campos":{"date":"fecha principal YYYY-MM-DD","price":"importe total sin símbolo €","company":"empresa/compañía","description":"descripción principal","reference":"nº referencia, póliza, expediente","result":"resultado ITV si aplica","expiry":"fecha vencimiento YYYY-MM-DD","km":"kilometraje si aparece","liters":"litros si es combustible","pricePerL":"precio por litro si es combustible","workshop":"taller o establecimiento","address":"dirección si aparece","notes":"datos adicionales relevantes"}}
Si no puedes leer un campo, omítelo. No inventes datos.`;

function ScannerView({vehicle,onBack,onUpdate}){
  const[phase,setPhase]=useState("upload");
  const[imgB64,setImgB64]=useState(null);
  const[imgPreview,setPreview]=useState(null);
  const[loading,setLoading]=useState(false);
  const[error,setError]=useState(null);
  const[result,setResult]=useState(null);
  const[campos,setCampos]=useState({});
  const[destino,setDestino]=useState("");
  const inputRef=useRef();

  const handleFile=async(e)=>{
    const file=e.target.files?.[0]; if(!file) return;
    setError(null);
    const reader=new FileReader();
    reader.onload=ev=>setPreview(ev.target.result);
    reader.readAsDataURL(file);
    const b64full=await compressImage(file,1600,0.8);
    setImgB64(b64full.split(",")[1]);
    setPhase("ready");
  };

  const analyze=async()=>{
    if(!imgB64) return;
    setLoading(true); setError(null); setPhase("analyzing");
    try{
      const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,system:EXTRACT_SYSTEM,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:imgB64}},{type:"text",text:"Extrae todos los datos de este documento de vehículo."}]}]})});
      const data=await resp.json();
      const text=data.content?.find(b=>b.type==="text")?.text||"";
      const json=JSON.parse(text.trim().replace(/```json|```/g,"").trim());
      setResult(json); setCampos(json.campos||{}); setDestino(json.destino||"breakdowns"); setPhase("review");
    }catch(err){setError("No se pudo analizar el documento. Inténtalo de nuevo.");setPhase("ready");}
    setLoading(false);
  };

  const save=()=>{
    const c=campos; const id=Date.now().toString();
    let updated=JSON.parse(JSON.stringify(vehicle));
    const attach=imgPreview?{type:"img",name:"doc_escaneado.jpg",size:Math.round((imgB64||"").length*0.75/1024),data:imgPreview,driveOnly:false}:null;
    if(destino==="itv"){updated.itv={...updated.itv,expiry:c.expiry||updated.itv?.expiry||"",result:c.result||updated.itv?.result||"",price:c.price||updated.itv?.price||"",station:c.workshop||updated.itv?.station||""};updated.itvHistory=[{expiry:c.expiry||"",result:c.result||"",price:c.price||"",station:c.workshop||"",date:c.date||"",notes:c.notes||"",archivedAt:c.date||new Date().toISOString().slice(0,10)},...(updated.itvHistory||[])];}
    else if(destino==="insurance"){updated.insuranceHistory=[{company:c.company||"",type:"",price:c.price||"",expiry:c.expiry||"",policyNum:c.reference||"",promotions:"",notes:c.notes||"",archivedAt:c.date||new Date().toISOString().slice(0,10)},...(updated.insuranceHistory||[])];}
    else if(destino==="ivtm"){updated.ivtmHistory=[{year:c.date?.slice(0,4)||"",date:c.date||"",price:c.price||"",municipality:c.workshop||"",reference:c.reference||"",notes:c.notes||"",archivedAt:c.date||new Date().toISOString().slice(0,10)},...(updated.ivtmHistory||[])];}
    else if(destino==="revisions"){updated.revisions=[{id,name:c.description||"Revisión",items:c.notes||"",lastDate:c.date||"",lastKm:c.km||"",price:c.price||"",workshop:c.workshop||"",workshopAddress:c.address||"",nextKm:"",nextDate:""},...(updated.revisions||[])];}
    else if(destino==="breakdowns"){updated.breakdowns=[{id,description:c.description||"Avería",workshop:c.workshop||"",workshopAddress:c.address||"",date:c.date||"",price:c.price||"",notes:c.notes||"",bills:[{concept:c.description||"Factura",date:c.date||"",amount:c.price||"",attach}]},...(updated.breakdowns||[])];}
    else if(destino==="claims"){updated.claims=[{id,cause:c.description||"Siniestro",date:c.date||"",price:c.price||"",insRef:c.reference||"",workshop:c.workshop||"",notes:c.notes||"",status:"Abierto",liability:"",damages:"",bills:[{concept:c.description||"Documento",date:c.date||"",amount:c.price||"",attach}]},...(updated.claims||[])];}
    else if(destino==="fuel"){updated.fuelLogs=[{id,date:c.date||"",liters:c.liters||"",pricePerL:c.pricePerL||"",total:c.price||"",station:c.workshop||"",notes:c.notes||""},...(updated.fuelLogs||[])];}
    else{const key=destino;const newDoc={id,type:result?.tipoDoc||"Documento escaneado",name:c.reference||c.description||"",notes:c.notes||"",attach};updated[key]=[newDoc,...(updated[key]||[])];}
    onUpdate(updated); setPhase("saved");
  };

  const upd=(k,v)=>setCampos(p=>({...p,[k]:v}));
  const destInfo=SCAN_DESTINATIONS.find(d=>d.id===destino);

  return(
    <SectionLayout title="Escanear documento" emoji="📸" col={C.gold} onBack={onBack}>
      {(phase==="upload"||phase==="ready")&&(
        <>
          <div onClick={()=>inputRef.current?.click()} style={{background:C.card,borderRadius:16,border:`2px dashed ${imgPreview?C.gold:C.border}`,minHeight:200,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",cursor:"pointer",marginBottom:12,overflow:"hidden"}}>
            {imgPreview?<img src={imgPreview} alt="doc" style={{width:"100%",maxHeight:280,objectFit:"contain"}}/>:<><div style={{fontSize:48,marginBottom:10}}>📄</div><div style={{fontSize:14,fontWeight:700,color:C.text,marginBottom:4}}>Toca para subir documento</div><div style={{fontSize:11,color:C.dim}}>Foto de ITV, factura, seguro…</div></>}
          </div>
          <input ref={inputRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleFile}/>
          {error&&<div style={{background:"#c0392b22",border:"1px solid #c0392b44",borderRadius:10,padding:"10px 14px",marginBottom:12,fontSize:12,color:C.danger}}>{error}</div>}
          {imgPreview&&(
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>{setImgB64(null);setPreview(null);setPhase("upload");}} style={{...ghostBtn(C.dim),flex:1,justifyContent:"center"}}>🗑️ Quitar</button>
              <button onClick={analyze} style={{...primaryBtn(C.gold,"#080c18"),flex:2,fontSize:15}}>🔍 Analizar documento</button>
            </div>
          )}
        </>
      )}
      {phase==="analyzing"&&(
        <div style={{textAlign:"center",padding:"60px 20px"}}>
          <div style={{fontSize:48,marginBottom:16,display:"inline-block",animation:"spin 1s linear infinite"}}>🔍</div>
          <div style={{fontSize:16,fontWeight:700,color:C.text,marginBottom:8}}>Analizando documento…</div>
          <div style={{fontSize:12,color:C.dim}}>Claude está leyendo y extrayendo los datos</div>
        </div>
      )}
      {phase==="review"&&result&&(
        <>
          <div style={{background:`linear-gradient(135deg,${C.gold}22,${C.card})`,border:`1px solid ${C.gold}44`,borderRadius:14,padding:14,marginBottom:12}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div><div style={{fontSize:11,color:C.gold,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:4}}>Documento detectado</div><div style={{fontSize:16,fontWeight:800,color:C.text}}>{result.tipoDoc}</div></div>
              <Pill c={result.confianza==="alta"?C.ok:result.confianza==="media"?C.warn:C.danger}>{result.confianza==="alta"?"✓ Alta":result.confianza==="media"?"⚠ Media":"⚠ Baja"}</Pill>
            </div>
          </div>
          {imgPreview&&<div style={{marginBottom:12,borderRadius:12,overflow:"hidden",maxHeight:140}}><img src={imgPreview} alt="doc" style={{width:"100%",objectFit:"contain",background:C.card}}/></div>}
          <div style={{background:C.card,borderRadius:14,padding:14,marginBottom:12,border:`1px solid ${C.border}`}}>
            <label style={{fontSize:10,color:C.dim,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em",display:"block",marginBottom:8}}>📂 Guardar en</label>
            <select value={destino} onChange={e=>setDestino(e.target.value)} style={{width:"100%",background:C.input,border:`1px solid ${C.border}`,borderRadius:9,padding:"10px 14px",color:C.text,fontSize:14,outline:"none"}}>
              {SCAN_DESTINATIONS.map(d=><option key={d.id} value={d.id}>{d.label}</option>)}
            </select>
            {destInfo&&<div style={{fontSize:11,color:C.dim,marginTop:6}}>💡 {destInfo.hint}</div>}
          </div>
          <div style={{background:C.card,borderRadius:14,padding:14,marginBottom:12,border:`1px solid ${C.border}`}}>
            <div style={{fontSize:11,fontWeight:700,color:C.gold,textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:14}}>✏️ Revisa y corrige los datos</div>
            <Field label="Fecha del documento" type="date" value={campos.date} onChange={v=>upd("date",v)}/>
            <Field label="Importe (€)" type="number" value={campos.price} onChange={v=>upd("price",v)} placeholder="0.00"/>
            <Field label="Empresa / compañía / taller" value={campos.company||campos.workshop} onChange={v=>{upd("company",v);upd("workshop",v);}} placeholder=""/>
            <Field label="Descripción / concepto" value={campos.description} onChange={v=>upd("description",v)} placeholder=""/>
            <Field label="Referencia / nº expediente" value={campos.reference} onChange={v=>upd("reference",v)} placeholder=""/>
            {destino==="itv"&&<Field label="Resultado ITV" value={campos.result} onChange={v=>upd("result",v)} placeholder="Favorable / Desfavorable"/>}
            {(destino==="itv"||destino==="insurance")&&<Field label="Fecha vencimiento" type="date" value={campos.expiry} onChange={v=>upd("expiry",v)}/>}
            {destino==="fuel"&&<><Field label="Litros" type="number" value={campos.liters} onChange={v=>upd("liters",v)} placeholder="0.00"/><Field label="€ / litro" type="number" value={campos.pricePerL} onChange={v=>upd("pricePerL",v)} placeholder="1.650"/></>}
            <Field label="Km (si aparece)" type="number" value={campos.km} onChange={v=>upd("km",v)} placeholder=""/>
            <Field label="Dirección (si aparece)" value={campos.address} onChange={v=>upd("address",v)} placeholder=""/>
            <Field label="Notas adicionales" value={campos.notes} onChange={v=>upd("notes",v)} placeholder="Cualquier dato extra…"/>
          </div>
          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>{setPhase("ready");setResult(null);}} style={{...ghostBtn(C.dim),flex:1,justifyContent:"center"}}>← Volver</button>
            <button onClick={save} style={{...primaryBtn(C.gold,"#080c18"),flex:2,fontSize:15}}>💾 Guardar</button>
          </div>
        </>
      )}
      {phase==="saved"&&(
        <div style={{textAlign:"center",padding:"60px 20px"}}>
          <div style={{fontSize:64,marginBottom:16}}>✅</div>
          <div style={{fontSize:18,fontWeight:900,color:C.ok,marginBottom:8}}>¡Guardado!</div>
          <div style={{fontSize:13,color:C.dim,marginBottom:24}}>Guardado en <strong style={{color:C.text}}>{destInfo?.label||destino}</strong></div>
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            <button onClick={()=>{setPhase("upload");setImgB64(null);setPreview(null);setResult(null);setCampos({});}} style={{...primaryBtn(C.blue),width:"100%"}}>📸 Escanear otro documento</button>
            <button onClick={onBack} style={{...ghostBtn(C.dim),width:"100%",justifyContent:"center"}}>← Volver al coche</button>
          </div>
        </div>
      )}
    </SectionLayout>
  );
}

function VehicleEditForm({vehicle,onSave,onCancel}){
  const[v,setV]=useState(vehicle);
  const upd=(path,val)=>{setV(prev=>{const c=JSON.parse(JSON.stringify(prev));const ks=path.split(".");let cur=c;for(let i=0;i<ks.length-1;i++)cur=cur[ks[i]]=(cur[ks[i]]||{});cur[ks[ks.length-1]]=val;return c;});};
  const[sec,setSec]=useState("datos");
  const secs=[{id:"datos",l:"🚗 Datos"},{id:"ruedas",l:"🔵 Ruedas"},{id:"itv",l:"🔧 ITV"},{id:"seguro",l:"🛡️ Seguro"},{id:"ficha",l:"📄 Ficha"}];
  return(
    <div style={{minHeight:"100vh",background:C.bg,paddingBottom:32}}>
      <div style={{background:C.panel,padding:"16px 20px",borderBottom:`1px solid ${C.border}`,position:"sticky",top:0,zIndex:50,display:"flex",alignItems:"center",gap:12}}>
        <Back onClick={onCancel}/>
        <div style={{flex:1,fontSize:15,fontWeight:800}}>{v.name||"Editar vehículo"}</div>
        <button onClick={()=>onSave(v)} style={{background:C.goldDim,border:`1px solid ${C.gold}44`,color:C.gold,borderRadius:9,padding:"6px 16px",fontSize:12,fontWeight:700,cursor:"pointer"}}>💾 Guardar</button>
      </div>
      <div style={{display:"flex",gap:8,padding:"12px 16px",overflowX:"auto",scrollbarWidth:"none"}}>
        {secs.map(s=><button key={s.id} onClick={()=>setSec(s.id)} style={{whiteSpace:"nowrap",padding:"6px 14px",borderRadius:20,border:`1px solid ${sec===s.id?C.gold:C.border}`,background:sec===s.id?C.goldDim:C.card,color:sec===s.id?C.gold:C.dim,fontSize:12,fontWeight:600,cursor:"pointer"}}>{s.l}</button>)}
      </div>
      <div style={{padding:"0 16px"}}>
        {sec==="datos"&&<div style={{background:C.card,borderRadius:14,padding:16,border:`1px solid ${C.border}`}}>
          <PhotoUploader label="Foto del vehículo" value={v.photo} onChange={val=>upd("photo",val)} maxW={800} quality={0.6} size={140}/>
          <Field label="Nombre / alias" value={v.name} onChange={val=>upd("name",val)} placeholder="Ej: Coche familiar"/>
          <Field label="Matrícula" value={v.plate} onChange={val=>upd("plate",val)} placeholder="Ej: 1234 ABC"/>
          <Field label="Marca" value={v.brand} onChange={val=>upd("brand",val)} placeholder="Ej: Seat"/>
          <Field label="Modelo" value={v.model} onChange={val=>upd("model",val)} placeholder="Ej: León"/>
          <Field label="Año" type="number" value={v.year} onChange={val=>upd("year",val)} placeholder="Ej: 2019"/>
          <Sel label="Tipo de vehículo" value={v.vehicleType} onChange={val=>upd("vehicleType",val)} opts={[{v:"Turismo",l:"Turismo"},{v:"SUV",l:"SUV"},{v:"Monovolumen",l:"Monovolumen"},{v:"Furgoneta",l:"Furgoneta"},{v:"Moto",l:"Moto"}]}/>
          <Sel label="Combustible" value={v.fuel} onChange={val=>upd("fuel",val)} opts={[{v:"",l:"—"},{v:"Gasolina",l:"⛽ Gasolina"},{v:"Diésel",l:"⛽ Diésel"},{v:"Híbrido",l:"🔋 Híbrido"},{v:"Eléctrico",l:"⚡ Eléctrico"},{v:"GLP",l:"🔵 GLP"}]}/>
          <Field label="Color" value={v.color} onChange={val=>upd("color",val)} placeholder="Ej: Blanco perla"/>
          <Field label="Potencia (CV)" type="number" value={v.power} onChange={val=>upd("power",val)} placeholder="Ej: 115"/>
          <Field label="Kilometraje actual" type="number" value={v.currentKm} onChange={val=>upd("currentKm",val)} placeholder="Ej: 45000"/>
          <Field label="Fecha de matriculación" type="date" value={v.regDate} onChange={val=>upd("regDate",val)}/>
          <Field label="Nº bastidor (VIN)" value={v.vin} onChange={val=>upd("vin",val)} placeholder="17 caracteres"/>
          <Field label="Notas" value={v.notes} onChange={val=>upd("notes",val)} placeholder="Cualquier información útil..."/>
        </div>}
        {sec==="compra"&&<div style={{background:C.card,borderRadius:14,padding:16,border:`1px solid ${C.border}`}}>
          <div style={{fontSize:11,color:C.dim,marginBottom:14}}>Datos de compra para calcular el coste total de propiedad.</div>

        </div>}
        {sec==="ficha"&&<div style={{background:C.card,borderRadius:14,padding:16,border:`1px solid ${C.border}`}}>

          <Field label="Matrícula" value={v.ficha?.matricula} onChange={val=>upd("ficha.matricula",val)} placeholder="Ej: 9703 JZY"/>
          <Field label="VIN — E" value={v.ficha?.vin} onChange={val=>upd("ficha.vin",val)} placeholder="VF1RFC00857975771"/>
          <Field label="Marca — D.1" value={v.ficha?.marca} onChange={val=>upd("ficha.marca",val)} placeholder="RENAULT"/>
          <Field label="Denominación — D.3" value={v.ficha?.denominacion} onChange={val=>upd("ficha.denominacion",val)} placeholder="ESPACE"/>
